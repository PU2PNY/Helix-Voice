name: Rust CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace

      - name: Helix lab self-test
        run: cargo run --quiet -p helix-lab -- self-test

      - name: Helix daemon self-test
        run: cargo run --quiet -p helix-daemon -- --self-test

  static-lab:
    needs: rust
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install musl tools
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Install Rust musl target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Build static helix-lab
        run: |
          cargo build --release -p helix-lab -p helix-daemon --target x86_64-unknown-linux-musl
          mkdir -p dist
          cp target/x86_64-unknown-linux-musl/release/helix-lab dist/helix-lab
          cp target/x86_64-unknown-linux-musl/release/helix-daemon dist/helix-daemon
          chmod 0755 dist/helix-lab dist/helix-daemon
          sha256sum dist/helix-lab > dist/helix-lab.sha256
          sha256sum dist/helix-daemon > dist/helix-daemon.sha256

      - name: Upload static helix-lab
        uses: actions/upload-artifact@v7
        with:
          name: helix-linux-x86_64-musl
          path: dist/
          if-no-files-found: error
          retention-days: 7
